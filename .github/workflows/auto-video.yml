name: Kids Shorts Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

         - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv==1.0.0 groq==0.4.1 httpx==0.27.2 edge-tts==6.1.9 moviepy==1.0.3 Pillow==10.2.0 requests==2.31.0
          pip install --force-reinstall httpx==0.27.2

      - name: Generate kids video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          USE_OLLAMA: "false"
        run: |
          python main.py

      - name: Save generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-shorts-files
          path: output/
          if-no-files-found: ignore
          retention-days: 3
